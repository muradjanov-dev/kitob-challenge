name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax check
        run: python -m compileall -q manage.py src tgbot utils
      - name: Entrypoint syntax check
        run: sh -n entrypoint.sh

