name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-kitob-challenge
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kitob-challenge:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kitob-challenge:latest
          cache-from: type=gha,scope=kitob-challenge
          cache-to: type=gha,mode=max,scope=kitob-challenge

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "/srv/stack/scripts/deploy.sh kitob-challenge ${{ github.sha }}"
      - name: Check public web and Celery health
        run: |
          set -euo pipefail
          for service in redis celery; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --retry-delay 3 --max-time 15 \
              "https://kitob.standart-eko.uz/health-check/$service/" \
              | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "success"'
          done
