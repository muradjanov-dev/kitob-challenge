<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kitob Detektivi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#18181b;--card:#212126;--card2:#28282f;--text:#ece9e2;--muted:#95938d;
      --accent:#5e6d8a;--accent2:#52796f;--ok:#468a68;--bad:#b85d68;--line:#32323a;}
    @media (prefers-color-scheme: light){:root{--bg:#faf7f2;--card:#f3eee6;--card2:#eae4d8;--text:#2a2723;--muted:#736f68;--accent:#5e6d8a;--accent2:#52796f;--line:#dfd7ca;}}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 36px;max-width:620px;margin:0 auto}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .title{font-weight:800;font-size:19px;letter-spacing:-0.02em}.title small{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-top:2px}
    .timer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;font-variant-numeric:tabular-nums;min-width:76px;text-align:center}
    .timer .lbl{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.5px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
    .clue{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
    .clue:last-child{border-bottom:0}
    .clue .n{background:var(--accent);color:#fff;border-radius:50%;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
    .clue .t{flex:1;font-size:14.5px;line-height:1.45;color:var(--text)}
    .inrow{display:flex;gap:10px;margin-top:10px}
    input[type=text]{-webkit-user-select:text;user-select:text;flex:1;background:var(--card2);border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:14px;font-size:16px;font-weight:700;outline:none;font-family:inherit}
    input:focus{border-color:var(--accent)}
    button.send{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:0 22px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .1s}
    button.send:active{transform:scale(.98)}
    button.send:disabled{opacity:.4}
    .toast{min-height:22px;margin-top:10px;font-size:14px;font-weight:700;text-align:center}
    .toast.ok{color:var(--ok)}.toast.bad{color:var(--bad)}
    .solvedbox{background:rgba(70,138,104,.15);border:1px solid var(--ok);color:var(--ok);border-radius:14px;padding:12px;text-align:center;font-weight:700;margin-top:10px}
    .sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:2px 0 10px}
    .lb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
    .lb:last-child{border-bottom:0}.rank{width:26px;text-align:center;font-weight:900}
    .rank.g1{color:#d4af37}.rank.g2{color:#a8b0ba}.rank.g3{color:#c48c66}
    .lb-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
    .pts{font-weight:800;color:var(--accent);font-size:15px}
    .me{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .me b{font-size:20px;color:var(--accent)}
    .big{text-align:center;padding:30px 18px}.big .em{font-size:48px;margin-bottom:8px}.big h2{margin:10px 0 8px;font-size:21px;font-weight:800}.big p{color:var(--muted);margin:0;font-size:14.5px;line-height:1.5}
    .lifetime{text-align:center;color:var(--muted);font-size:12.5px;margin-top:14px;font-weight:600}
    .statsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
    .sbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
    .sbox b{display:block;font-size:18px;color:var(--accent)}.sbox span{font-size:10px;color:var(--muted);font-weight:600}
    .hrow{text-align:left;padding:10px 2px;border-bottom:1px solid var(--line)}.hrow:last-child{border-bottom:0}
    .hrow .hd{font-size:11px;color:var(--muted)}.hrow .hw{font-weight:700}
    .muted{color:var(--muted)}.hidden{display:none !important}
  </style>
</head>
<body>
  <div class="top">
    <div class="title">📖 Kitob Detektivi <small id="subtitle">Jonli o'yin</small></div>
    <div class="timer"><span class="lbl" id="timerLbl">QOLDI</span><span id="timer">--:--</span></div>
  </div>

  <div id="live" class="hidden">
    <div class="card" style="background:rgba(255,204,77,.12);border:1px solid var(--accent2);font-size:12.5px;line-height:1.5;padding:10px 12px">🎁 <b>Kirish BEPUL!</b> ⏱ Qancha erta topsangiz, shuncha ko'p ochko: 1-ipuchida <b>30</b>, 2-da <b>20</b>, 3-da <b>10</b>.</div>
    <div class="card">
      <div class="sect" id="roundLbl">1-RAUND / 8</div>
      <div id="clues"></div>
      <div class="inrow" id="guessRow">
        <input id="guess" type="text" autocomplete="off" placeholder="Kitob yoki muallif nomi…" enterkeyhint="send">
        <button class="send" id="sendBtn">Topdim!</button>
      </div>
      <div class="toast" id="toast"></div>
      <div class="solvedbox hidden" id="solvedBox"></div>
    </div>
    <div class="me"><span>Sizning ballaringiz</span><b id="myPts">0</b></div>
    <div class="card"><div class="sect">🏆 Reyting</div><div id="board"></div></div>
  </div>

  <div id="info" class="card big hidden"></div>
  <div id="lifetime" class="lifetime hidden"></div>

  <script>
    var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
    if(tg){try{tg.ready();tg.expand();}catch(e){}}
    function readInit(){if(tg&&tg.initData)return tg.initData;try{var q=new URLSearchParams(location.search).get('tgWebAppData');if(q)return q;}catch(e){}var h=(location.hash||'').replace(/^#/,'');if(h){try{var d=new URLSearchParams(h).get('tgWebAppData');if(d)return d;}catch(e){}}return'';}
    var INIT=readInit();
    var $=function(id){return document.getElementById(id);};
    var localSeconds=0,busy=false,lastRound=-1;
    function fmt(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return(m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
    function esc(t){return(t||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function api(path,opts){opts=opts||{};opts.headers=Object.assign({'X-Telegram-Init-Data':INIT},opts.headers||{});return fetch(path,opts).then(function(r){return r.json();});}

    function statsHistoryHtml(s){
      var lt=s.lifetime||{};
      var h='<div class="statsgrid"><div class="sbox"><b>'+(lt.games||0)+'</b><span>O\'yin</span></div><div class="sbox"><b>'+(lt.points||0)+'</b><span>Jami ochko</span></div><div class="sbox"><b>'+(lt.solved||0)+'</b><span>Topilgan</span></div></div>';
      if(s.history&&s.history.length){
        h+='<div class="sect" style="margin-top:16px;text-align:left">🕘 O\'tgan o\'yinlar</div>';
        s.history.forEach(function(g){h+='<div class="hrow"><div class="hd">'+esc(g.date)+'</div><div class="hw">🥇 '+esc(g.winner)+' <span class="muted">('+g.winner_points+' ochko)</span></div><div class="muted" style="font-size:12px">'+g.players+' 👤</div></div>';});
      }
      return h;
    }

    function render(s){
      var live=$('live'),info=$('info');
      if(s.status==='live'){
        live.classList.remove('hidden');info.classList.add('hidden');
        $('subtitle').textContent='Raund '+s.round_number+' / '+s.round_total;
        $('roundLbl').textContent=s.round_number+'-RAUND / '+s.round_total;
        $('myPts').textContent=s.your_points||0;
        if(s.round_index!==lastRound){lastRound=s.round_index;$('guess').value='';$('toast').textContent='';}
        var c='';(s.clues||[]).forEach(function(clue,i){c+='<div class="clue"><div class="n">'+(i+1)+'</div><div class="t">'+esc(clue)+'</div></div>';});
        $('clues').innerHTML=c;
        var solvedBox=$('solvedBox'),guessRow=$('guessRow');
        if(s.solved){
          solvedBox.classList.remove('hidden');guessRow.classList.add('hidden');
          solvedBox.textContent=(s.solved_mine?'🎉 Siz topdingiz! ':'✅ ')+'Javob: '+s.solved_display+(s.solved_mine?'':' — topdi: '+s.solved_by);
        }else{
          solvedBox.classList.add('hidden');guessRow.classList.remove('hidden');
        }
        var b='';(s.leaderboard||[]).forEach(function(r,i){var cls=i===0?'g1':i===1?'g2':i===2?'g3':'';b+='<div class="lb"><div class="rank '+cls+'">'+(i+1)+'</div><div class="lb-name">'+esc(r.name)+'</div><div class="pts">'+r.points+'</div></div>';});
        $('board').innerHTML=b||'<div class="muted" style="padding:6px 0">Hali hech kim ochko olmadi.</div>';
        localSeconds=s.seconds;$('timerLbl').textContent='QOLDI';
      }else{
        live.classList.add('hidden');info.classList.remove('hidden');
        if(s.status==='scheduled'){
          $('timerLbl').textContent='BOSHLANISH';$('subtitle').textContent='Tez orada';
          info.innerHTML='<div class="em">📖</div><h2>O\'yin boshlanmoqda</h2><p>Har raundda maxfiy kitob asta-sekin ipuchlari orqali ochiladi. Birinchi to\'g\'ri topgan g\'olib — qancha erta, shuncha ko\'p ochko! Tayyor turing!</p>'+statsHistoryHtml(s);
          localSeconds=s.seconds;
        }else if(s.status==='finished'){
          $('timerLbl').textContent='TUGADI';$('timer').textContent='00:00';$('subtitle').textContent='Tugadi';
          var w='';(s.leaderboard||[]).forEach(function(r,i){var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';var rew=r.reward?'<span style="color:var(--accent2);font-weight:800">🪙 +'+r.reward+'</span>':'';w+='<div class="lb"><div class="rank">'+medal+'</div><div class="lb-name">'+esc(r.name)+' <span class="muted">'+r.points+'</span></div><div class="pts">'+rew+'</div></div>';});
          var mine=s.your_reward?('<div class="me" style="margin-top:12px"><span>Sizning mukofotingiz</span><b>🪙 +'+s.your_reward+'</b></div>'):'';
          info.innerHTML='<div class="em">🏁</div><h2>O\'yin tugadi!</h2><p>Eng ko\'p topganlar mukofot oldi 🎉</p>'+mine+(w?'<div style="text-align:left;margin-top:14px">'+w+'</div>':'')+statsHistoryHtml(s);
          localSeconds=0;
        }else{
          $('timerLbl').textContent='—';$('timer').textContent='--:--';$('subtitle').textContent='Kutilmoqda';
          info.innerHTML='<div class="em">📖</div><h2>Hozircha o\'yin yo\'q</h2><p>Kitob Detektivi tez orada boshlanadi — guruhni kuzating!</p>'+statsHistoryHtml(s);
          localSeconds=0;
        }
      }
      var lt=s.lifetime||{games:0,points:0};var lel=$('lifetime');lel.classList.remove('hidden');
      lel.innerHTML="📊 Umumiy: <b>"+lt.games+"</b> o'yin · <b>"+lt.points+"</b> ochko";
      $('timer').textContent=fmt(localSeconds);
    }

    function poll(){api('/detektiv/api/state/').then(function(s){if(!s||s.ok===false){$('info').classList.remove('hidden');$('live').classList.add('hidden');$('info').innerHTML='<div class="em">🔒</div><h2>Kirish xatosi</h2><p>Saytni ✨ Sayt tugmasi orqali qayta oching.</p>';return;}render(s);}).catch(function(){});}

    function send(){
      if(busy)return;var inp=$('guess');var text=(inp.value||'').trim();if(!text)return;
      busy=true;$('sendBtn').disabled=true;
      api('/detektiv/api/submit/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})}).then(function(r){
        var t=$('toast');
        if(r.ok){
          t.className='toast ok';t.textContent='🎉 Topdingiz! +'+r.gained+' ochko — '+r.display;
          if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}
          poll();
        }else{
          t.className='toast bad';
          t.textContent=({wrong:"Noto'g'ri, qayta urinib ko'ring.",already_solved:"Bu raund allaqachon topildi.",insufficient_balance:"🪙 Kirish uchun 40 Kitobcha kerak — balansingiz yetarli emas.",not_live:"O'yin faol emas.",empty:"Nom yozing."})[r.error]||"Qabul qilinmadi.";
        }
      }).catch(function(){$('toast').className='toast bad';$('toast').textContent='Tarmoq xatosi.';}).then(function(){busy=false;$('sendBtn').disabled=false;});
    }
    $('sendBtn').addEventListener('click',send);
    $('guess').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();send();}});
    setInterval(function(){if(localSeconds>0){localSeconds--;$('timer').textContent=fmt(localSeconds);}},1000);
    poll();setInterval(poll,1500);
  </script>
{% include "_tracking.html" with section="detective" %}
</body>
</html>
