<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Hikmat Xazinasi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--text:#eef1f6;--muted:#9aa4b2;
      --accent:#1f9e6b;--accent2:#ffcc4d;--ok:#25c26e;--bad:#ff5d6c;--line:#262b36;}
    @media (prefers-color-scheme: light){:root{--bg:#f4f6fb;--card:#fff;--card2:#f0f2f8;--text:#141821;--muted:#5b6472;--accent:#178a5c;--accent2:#f0b400;--line:#e6e9f2;}}
    *{box-sizing:border-box}html,body{margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;padding:14px 12px 28px;max-width:640px;margin:0 auto}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .title{font-weight:800;font-size:18px}.title small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
    .timer{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
    .timer .lbl{display:block;font-size:10px;color:var(--muted);font-weight:600}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
    .qcard{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-align:center;padding:24px 18px}
    .qcard .qn{font-size:12px;font-weight:800;opacity:.9}
    .qtext{font-size:19px;font-weight:800;line-height:1.35;margin-top:8px}
    .opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;margin-bottom:9px;cursor:pointer}
    .opt:hover{border-color:var(--accent)}
    .opt.correct{background:rgba(37,194,110,.18);border-color:var(--ok);color:var(--ok);font-weight:800}
    .opt.wrong{background:rgba(255,93,108,.15);border-color:var(--bad);color:var(--bad)}
    .opt:disabled{cursor:default}
    .stat{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
    .stat .box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
    .stat .box b{display:block;font-size:20px;color:var(--accent)}
    .stat .box span{font-size:11px;color:var(--muted)}
    .sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:2px 0 10px}
    .lb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
    .lb:last-child{border-bottom:0}.rank{width:26px;text-align:center;font-weight:900}
    .rank.g1{color:#ffcc4d}.rank.g2{color:#c9d1dc}.rank.g3{color:#e6a56b}
    .lb-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pts{font-weight:900;color:var(--accent)}
    .big{text-align:center;padding:26px 16px}.big .em{font-size:46px}.big h2{margin:10px 0 6px;font-size:20px}.big p{color:var(--muted);margin:0;font-size:14px;line-height:1.5}
    .lifetime{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
    .statsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
    .sbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
    .sbox b{display:block;font-size:18px;color:var(--accent)}.sbox span{font-size:10px;color:var(--muted)}
    .hrow{text-align:left;padding:9px 2px;border-bottom:1px solid var(--line)}.hrow:last-child{border-bottom:0}
    .hrow .hd{font-size:11px;color:var(--muted)}.hrow .hw{font-weight:700}
    .muted{color:var(--muted)}.hidden{display:none}
    .toast{min-height:20px;margin-top:9px;font-size:14px;font-weight:700;text-align:center}
    .toast.ok{color:var(--ok)}.toast.bad{color:var(--bad)}
  </style>
</head>
<body>
  <div class="top">
    <div class="title">☪️ Hikmat Xazinasi <small id="subtitle">Jonli o'yin</small></div>
    <div class="timer"><span class="lbl" id="timerLbl">QOLDI</span><span id="timer">--:--</span></div>
  </div>

  <div id="live" class="hidden">
    <div class="card" style="background:rgba(255,204,77,.12);border:1px solid var(--accent2);font-size:12.5px;line-height:1.5;padding:10px 12px">🎁 <b>Kirish BEPUL!</b> 🔥 Ketma-ket to'g'ri javoblar ochkoni ko'paytiradi (x1 → x2 → x3)!</div>
    <div class="card qcard">
      <div class="qn" id="qn">SAVOL</div>
      <div class="qtext" id="qtext">—</div>
    </div>
    <div class="card" id="optsCard"><div id="opts"></div><div class="toast" id="toast"></div></div>
    <div class="stat">
      <div class="box"><b id="myPts">0</b><span>Ballaringiz</span></div>
      <div class="box"><b id="qnum">1/1</b><span>Savol</span></div>
    </div>
    <div class="card"><div class="sect">🏆 Reyting</div><div id="board"></div></div>
  </div>

  <div id="info" class="card big hidden"></div>
  <div id="lifetime" class="lifetime hidden"></div>

  <script>
    var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
    if(tg){try{tg.ready();tg.expand();}catch(e){}}
    function readInit(){if(tg&&tg.initData)return tg.initData;try{var q=new URLSearchParams(location.search).get('tgWebAppData');if(q)return q;}catch(e){}var h=(location.hash||'').replace(/^#/,'');if(h){try{var d=new URLSearchParams(h).get('tgWebAppData');if(d)return d;}catch(e){}}return'';}
    var INIT=readInit();
    var $=function(id){return document.getElementById(id);};
    var localSeconds=0,busy=false,lastQ=-1;
    var curOpts=[],curAnswered=false,curCorrectIdx=-1,curChoice=-1;
    function fmt(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return(m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
    function esc(t){return(t||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function api(path,opts){opts=opts||{};opts.headers=Object.assign({'X-Telegram-Init-Data':INIT},opts.headers||{});return fetch(path,opts).then(function(r){return r.json();});}

    function renderOpts(){
      var box=$('opts');box.innerHTML='';
      curOpts.forEach(function(o,i){
        var b=document.createElement('button');b.className='opt';b.textContent=(i+1)+'. '+o;
        if(curAnswered){
          b.disabled=true;
          if(i===curCorrectIdx)b.className='opt correct';
          else if(i===curChoice)b.className='opt wrong';
        }else{ b.addEventListener('click',function(){answer(i);}); }
        box.appendChild(b);
      });
    }

    function statsHistoryHtml(s){
      var lt=s.lifetime||{};
      var h='<div class="statsgrid"><div class="sbox"><b>'+(lt.games||0)+'</b><span>O\'yin</span></div><div class="sbox"><b>'+(lt.points||0)+'</b><span>Jami ochko</span></div><div class="sbox"><b>'+(lt.best||0)+'</b><span>Rekord</span></div><div class="sbox"><b>'+(lt.best_streak||0)+'</b><span>Eng uzun ketma-ket</span></div></div>';
      if(s.history&&s.history.length){
        h+='<div class="sect" style="margin-top:16px;text-align:left">🕘 O\'tgan o\'yinlar</div>';
        s.history.forEach(function(g){h+='<div class="hrow"><div class="hd">'+esc(g.date)+'</div><div class="hw">🥇 '+esc(g.winner)+' <span class="muted">('+g.winner_points+' ochko)</span></div><div class="muted" style="font-size:12px">'+g.players+' 👤</div></div>';});
      }
      return h;
    }

    function render(s){
      var live=$('live'),info=$('info');
      if(s.status==='live'){
        live.classList.remove('hidden');info.classList.add('hidden');
        $('subtitle').textContent='Savol '+s.q_number+' / '+s.q_total;
        $('qn').textContent='SAVOL '+s.q_number+' / '+s.q_total+' — kim aytgan?';
        $('myPts').textContent=s.your_points||0;$('qnum').textContent=s.q_number+'/'+s.q_total;
        if(s.q_index!==lastQ){lastQ=s.q_index;curAnswered=false;curCorrectIdx=-1;curChoice=-1;}
        $('qtext').textContent=s.quote||'';
        curOpts=s.options||[];
        if(s.answered){curAnswered=true;curChoice=(s.your_choice!==undefined?s.your_choice:-1);}
        if(s.phase==='reveal'){curCorrectIdx=(s.correct_index!==undefined?s.correct_index:-1);curAnswered=true;$('timerLbl').textContent='NATIJA';}
        else{$('timerLbl').textContent='JAVOB';}
        renderOpts();
        var b='';(s.leaderboard||[]).forEach(function(r,i){var cls=i===0?'g1':i===1?'g2':i===2?'g3':'';b+='<div class="lb"><div class="rank '+cls+'">'+(i+1)+'</div><div class="lb-name">'+esc(r.name)+'</div><div class="pts">'+r.points+'</div></div>';});
        $('board').innerHTML=b||'<div class="muted" style="padding:6px 0">Hali ball yo\'q.</div>';
        localSeconds=s.seconds;
      }else{
        live.classList.add('hidden');info.classList.remove('hidden');
        if(s.status==='scheduled'){
          $('timerLbl').textContent='BOSHLANISH';$('subtitle').textContent='Tez orada';
          info.innerHTML='<div class="em">☪️</div><h2>O\'yin boshlanmoqda</h2><p>Hikmatli gap kimga tegishli ekanini toping! Ketma-ket to\'g\'ri javoblar ochkoni oshiradi. Tayyor turing!</p>'+statsHistoryHtml(s);
          localSeconds=s.seconds;
        }else if(s.status==='finished'){
          $('timerLbl').textContent='TUGADI';$('timer').textContent='00:00';$('subtitle').textContent='Tugadi';
          var w='';(s.leaderboard||[]).forEach(function(r,i){var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';var rew=r.reward?'<span style="color:var(--accent2);font-weight:800">🪙 +'+r.reward+'</span>':'';w+='<div class="lb"><div class="rank">'+medal+'</div><div class="lb-name">'+esc(r.name)+' <span class="muted">'+r.points+'</span></div><div class="pts">'+rew+'</div></div>';});
          var mine=s.your_reward?('<div class="stat" style="margin-top:12px"><div class="box"><b>🪙 +'+s.your_reward+'</b><span>Sizning mukofotingiz</span></div></div>'):'';
          info.innerHTML='<div class="em">🏁</div><h2>O\'yin tugadi!</h2><p>Ochko olganlar mukofot oldi 🎉</p>'+mine+(w?'<div style="text-align:left;margin-top:14px">'+w+'</div>':'')+statsHistoryHtml(s);
          localSeconds=0;
        }else{
          $('timerLbl').textContent='—';$('timer').textContent='--:--';$('subtitle').textContent='Kutilmoqda';
          info.innerHTML='<div class="em">☪️</div><h2>Hozircha o\'yin yo\'q</h2><p>Hikmat Xazinasi tez orada boshlanadi — guruhni kuzating!</p>'+statsHistoryHtml(s);
          localSeconds=0;
        }
      }
      var lt=s.lifetime||{games:0,points:0};var lel=$('lifetime');lel.classList.remove('hidden');
      lel.innerHTML="📊 Umumiy: <b>"+lt.games+"</b> o'yin · <b>"+lt.points+"</b> ochko";
      $('timer').textContent=fmt(localSeconds);
    }

    function poll(){api('/hikmat/api/state/').then(function(s){if(!s||s.ok===false){$('info').classList.remove('hidden');$('live').classList.add('hidden');$('info').innerHTML='<div class="em">🔒</div><h2>Kirish xatosi</h2><p>Saytni ✨ Sayt tugmasi orqali qayta oching.</p>';return;}render(s);}).catch(function(){});}
    function answer(choice){
      if(busy||curAnswered)return;busy=true;
      api('/hikmat/api/submit/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choice:choice})}).then(function(r){
        if(r.ok||r.error==='already_answered'){
          $('toast').textContent='';
          curAnswered=true;curChoice=choice;curCorrectIdx=(r.correct_index!==undefined?r.correct_index:-1);renderOpts();
          if(r.ok && r.gained){
            var t=$('toast');t.className='toast ok';
            t.textContent='✅ +'+r.gained+' ochko'+(r.streak>1?' (x'+Math.min(r.streak,3)+' streak! 🔥)':'');
          }
          if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred(r.correct?'success':'error')}catch(e){}}
          poll();
        } else {
          var t=$('toast');t.className='toast bad';
          t.textContent=({insufficient_balance:"🪙 Kirish uchun 30 Kitobcha kerak — balansingiz yetarli emas.",not_answering:"Hozir javob vaqti emas."})[r.error]||"Qabul qilinmadi.";
        }
      }).catch(function(){}).then(function(){busy=false;});
    }
    setInterval(function(){if(localSeconds>0){localSeconds--;$('timer').textContent=fmt(localSeconds);}},1000);
    poll();setInterval(poll,1500);
  </script>
{% include "_tracking.html" with section="wisdom" %}
</body>
</html>
