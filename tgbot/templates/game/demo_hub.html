<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>O'yinlar — sinov (demo)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #15141c; --card: #211f2b; --text: #efeae0; --muted: #9b968c; --accent: #7d6bd6; --accent2: #3fa58a; }
    @media (prefers-color-scheme: light) { :root { --bg: #faf7f2; --card: #f1ebe0; --text: #2a2723; --muted: #736f68; } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 18px 14px 40px; color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(70vmax 70vmax at 0 0, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%),
                  radial-gradient(70vmax 70vmax at 100% 100%, color-mix(in srgb, var(--accent2) 26%, transparent), transparent 70%), var(--bg);
      min-height: 100vh; }
    h1 { font-size: 21px; margin: 4px 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 16px; font-size: 13.5px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    a.g { display: flex; align-items: center; min-height: 58px; padding: 12px; border-radius: 16px; text-decoration: none; color: var(--text);
      background: color-mix(in srgb, var(--card) 86%, transparent); font-weight: 700; font-size: 13.5px; line-height: 1.3;
      box-shadow: 0 6px 18px rgba(0,0,0,.14), inset 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent);
      animation: in .4s ease both; animation-delay: calc(var(--i) * 18ms); transition: transform .12s; }
    a.g:active { transform: scale(.97); }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { a.g { animation: none; } }
  </style>
</head>
<body>
  <h1>🧪 O'yinlarni sinab ko'rish</h1>
  <p class="sub">Yangilangan dizayn va animatsiyalar. Har bir o'yin haqiqiy savollar bilan <b>demo rejimda</b> ochiladi:
    ball yozilmaydi, Kitobcha berilmaydi. Demo faqat adminlar uchun.</p>
  <div class="grid">
    {% for g in games %}<a class="g" style="--i: {{ forloop.counter0 }}" href="{{ g.url }}?demo=1">{{ g.label }}</a>{% endfor %}
  </div>
  <script>
    // Carry initData along, like the site's own tab navigation does.
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      try { tg && tg.ready(); tg && tg.expand(); } catch (e) {}
      var init = (tg && tg.initData) || new URLSearchParams(location.search).get('tgWebAppData') || '';
      if (!init) return;
      document.querySelectorAll('a.g').forEach(function (a) {
        a.href = a.getAttribute('href') + '&tgWebAppData=' + encodeURIComponent(init);
      });
    })();
  </script>
</body>
</html>
