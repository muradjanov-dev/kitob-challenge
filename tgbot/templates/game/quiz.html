<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title id="pageTitle">Bilim O'yini</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--text:#eef1f6;--muted:#9aa4b2;
      --accent:#8a5cff;--accent2:#00c2a8;--ok:#25c26e;--bad:#ff5d6c;--line:#262b36;
      --teama:#3d7bff;--teamb:#ff5c8a;}
    @media (prefers-color-scheme: light){:root{--bg:#f4f6fb;--card:#fff;--card2:#f0f2f8;--text:#141821;--muted:#5b6472;--accent:#6f44e0;--accent2:#00a892;--line:#e6e9f2;}}
    *{box-sizing:border-box}html,body{margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;padding:14px 12px 28px;max-width:640px;margin:0 auto}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .title{font-weight:800;font-size:18px}.title small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
    .timer{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
    .timer .lbl{display:block;font-size:10px;color:var(--muted);font-weight:600}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
    .qcard{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-align:center;padding:22px 16px}
    .qcard .qn{font-size:12px;font-weight:800;opacity:.9}
    .qtext{font-size:18px;font-weight:800;line-height:1.35;margin-top:8px}
    .items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
    .chip{background:rgba(255,255,255,.2);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700}
    .qimg{max-width:100%;max-height:220px;border-radius:14px;margin-top:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
    .opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;margin-bottom:9px;cursor:pointer}
    .opt:hover{border-color:var(--accent)}
    .opt.correct{background:rgba(37,194,110,.18);border-color:var(--ok);color:var(--ok);font-weight:800}
    .opt.wrong{background:rgba(255,93,108,.15);border-color:var(--bad);color:var(--bad)}
    .opt:disabled{cursor:default}
    .toast{min-height:20px;margin-top:9px;font-size:14px;font-weight:700;text-align:center}
    .toast.ok{color:var(--ok)}.toast.bad{color:var(--bad)}
    .stat{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
    .stat .box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
    .stat .box b{display:block;font-size:20px;color:var(--accent)}
    .stat .box span{font-size:11px;color:var(--muted)}
    .teambar{display:flex;border-radius:12px;overflow:hidden;height:34px;border:1px solid var(--line);margin-bottom:12px}
    .teambar .a{background:var(--teama);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
    .teambar .b{background:var(--teamb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
    .sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:2px 0 10px}
    .lb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
    .lb:last-child{border-bottom:0}.rank{width:26px;text-align:center;font-weight:900}
    .rank.g1{color:#ffcc4d}.rank.g2{color:#c9d1dc}.rank.g3{color:#e6a56b}
    .lb-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lb-name.team-a{color:var(--teama)}.lb-name.team-b{color:var(--teamb)}
    .pts{font-weight:900;color:var(--accent)}
    .big{text-align:center;padding:26px 16px}.big .em{font-size:46px}.big h2{margin:10px 0 6px;font-size:20px}.big p{color:var(--muted);margin:0;font-size:14px;line-height:1.5}
    .lifetime{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
    .statsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
    .sbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
    .sbox b{display:block;font-size:18px;color:var(--accent)}.sbox span{font-size:10px;color:var(--muted)}
    .hrow{text-align:left;padding:9px 2px;border-bottom:1px solid var(--line)}.hrow:last-child{border-bottom:0}
    .hrow .hd{font-size:11px;color:var(--muted)}.hrow .hw{font-weight:700}
    .muted{color:var(--muted)}.hidden{display:none}
  </style>
</head>
<body data-flavor="{{ flavor }}">
  <div class="top">
    <div class="title"><span id="gameEmoji"></span> <span id="gameTitle">Bilim O'yini</span> <small id="subtitle">Jonli o'yin</small></div>

  <div id="live" class="hidden">

    <div class="card" id="optsCard"><div id="opts"></div><div class="toast" id="toast"></div></div>

      <div class="box"><b id="myPts">0</b><span id="myPtsLbl">Ballaringiz</span></div>

  <div id="info" class="card big hidden"></div>
  <div id="lifetime" class="lifetime hidden"></div>

  <script>

      blitz:     {emoji:'⚡️', title:"Blitz 60", accent:'#ffc107', accent2:'#ffe082'},

      plotmap:   {emoji:'🗺', title:"Syujet Xaritasi", accent:'#795548', accent2:'#bcaaa4'},
      sequence:  {emoji:'⏳', title:"Ketma-ketlik", accent:'#607d8b', accent2:'#b0bec5'},
      oddone:    {emoji:'🔍', title:"Ortiqchasini Top", accent:'#f44336', accent2:'#ef9a9a'},
      ending:    {emoji:'✍️', title:"Asar Yakuni", accent:'#673ab7', accent2:'#b39ddb'},
      pixel:     {emoji:'🖼', title:"Piksel Muqova", accent:'#2196f3', accent2:'#90caf9'},
      aiart:     {emoji:'🎨', title:"AI Rasmlar", accent:'#e91e63', accent2:'#f48fb1'},
      scenes:    {emoji:'🎭', title:"Sahna Ko'rinishi", accent:'#9c27b0', accent2:'#ce93d8'},
      audioquote:{emoji:'🎧', title:"Ovozli Iqtibos", accent:'#00bcd4', accent2:'#80deea'},
      mosaic:    {emoji:'🧩', title:"Kitob Mozaikasi", accent:'#4caf50', accent2:'#a5d6a7'},
      hiddendetail:{emoji:'🔎', title:"Yashirin Detal", accent:'#ff9800', accent2:'#ffcc80'},
      duel:      {emoji:'🤺', title:"1v1 Jonli Duel", accent:'#d32f2f', accent2:'#ef9a9a'},
      buzzer:    {emoji:'🔔', title:"Tezkor Qo'ng'iroq", accent:'#fbc02d', accent2:'#fff59d'},
      bracket:   {emoji:'🏆', title:"Haftalik Turnir", accent:'#f57c00', accent2:'#ffb74d'},
      auction:   {emoji:'💰', title:"Kitob Auksioni", accent:'#388e3c', accent2:'#a5d6a7'},
      regions:   {emoji:'👥', title:"Viloyatlar Jangi", accent:'#1976d2', accent2:'#90caf9'},
      king:      {emoji:'👑', title:"Qirol Taxti", accent:'#7b1fa2', accent2:'#ce93d8'},
      rhyme:     {emoji:'📜', title:"Bahri-Bayt", accent:'#5d4037', accent2:'#bcaaa4'},
      scholars:  {emoji:'🕌', title:"Sharq Allomalari", accent:'#00796b', accent2:'#80cbc4'},
      genres:    {emoji:'📚', title:"Janrlar Ustasi", accent:'#303f9f', accent2:'#9fa8da'},
      numbers:   {emoji:'🔢', title:"Adabiy Raqamlar", accent:'#c2185b', accent2:'#f48fb1'},
      worldlit:  {emoji:'🌍', title:"Jahon Adabiyoti", accent:'#0288d1', accent2:'#81d4fa'},
      mysterybox:{emoji:'🎁', title:"Sirli Sandiq", accent:'#e64a19', accent2:'#ffab91'},
      // 10 Mind, Logic & Conscious Living Games
      mindtrap:  {emoji:'🧠', title:"Fikr Tuzog'i", accent:'#6200ea', accent2:'#b388ff'},
      stoic:     {emoji:'🧘‍♂️', title:"Ongli Hayot", accent:'#00897b', accent2:'#80cbc4'},
      antiherd:  {emoji:'🐑', title:"Podadan Ajral", accent:'#d81b60', accent2:'#ff80ab'},
      dilemma:   {emoji:'⚖️', title:"Axloqiy Dilemma", accent:'#f57c00', accent2:'#ffb74d'},
      causeeffect:{emoji:'🔮', title:"Sabab va Oqibat", accent:'#512da8', accent2:'#9575cd'},
      masks:     {emoji:'🎭', title:"Niqoblar Foshi", accent:'#c2185b', accent2:'#f48fb1'},
      socrates:  {emoji:'🏛', title:"Sokrat Suhbatlari", accent:'#3949ab', accent2:'#7986cb'},
      memento:   {emoji:'⌛️', title:"Vaqt Paradoksi", accent:'#e65100', accent2:'#ffb74d'},
      strategy:  {emoji:'♟', title:"Strategik Tafakkur", accent:'#212121', accent2:'#9e9e9e'},
      paradox:   {emoji:'💡', title:"Paradokslar Olami", accent:'#00acc1', accent2:'#80deea'},
      // 10 Sufism, Nafs Purification & Divine Love Games
      simurgh:   {emoji:'🕊', title:"Simurg' Parvozi", accent:'#00838f', accent2:'#4dd0e1'},
      ishq:      {emoji:'🕯', title:"Parvona va Sham", accent:'#c62828', accent2:'#ef5350'},
      nafs:      {emoji:'🛡', title:"Nafs Tarbiyasi", accent:'#2e7d32', accent2:'#81c784'},
      qalb:      {emoji:'🪞', title:"Qalb Sayqali", accent:'#1565c0', accent2:'#64b5f6'},
      naqshband: {emoji:'🌾', title:"Xalvat dar Anjuman", accent:'#4e342e', accent2:'#a1887f'},
      yassaviy:  {emoji:'📜', title:"Hikmatlar Daryosi", accent:'#6a1b9a', accent2:'#ba68c8'},
      masnaviy:  {emoji:'🪈', title:"Nay Nidosi", accent:'#ad1457', accent2:'#f06292'},
      gazzoliy:  {emoji:'🗝', title:"Kimyoi Saodat", accent:'#f57f17', accent2:'#fff176'},
      fano:      {emoji:'🌊', title:"Fanofilloh", accent:'#00695c', accent2:'#4db6ac'},
      marifat:   {emoji:'☀️', title:"Haqiqat Quyoshi", accent:'#e65100', accent2:'#ffb74d'},
    };
    for (var k in BETA_GAMES) {
      if (!META[k]) {
        var bg = BETA_GAMES[k];
        META[k] = {
          emoji: bg.emoji,
          title: bg.title,
          fee: 25,
          api: '/' + k + '/api/',
          none: bg.title + " tez orada boshlanadi — guruhni kuzating!",
          scheduled: "Savollarga eng tez va to'g'ri javob bering!",
          accent: bg.accent,
          accent2: bg.accent2,
          isBeta: true
        };
      }
    }
    var M = META[FLAVOR] || META.twofacts;
    document.documentElement.style.setProperty('--accent', M.accent);
    document.documentElement.style.setProperty('--accent2', M.accent2);
    document.getElementById('pageTitle').textContent = M.title;
    document.getElementById('gameEmoji').textContent = M.emoji;
    document.getElementById('gameTitle').textContent = M.title;
    if (M.isBeta) {
      document.getElementById('subtitle').innerHTML = '<span style="display:inline-block;padding:2px 7px;background:linear-gradient(135deg,#ff9800,#f44336);color:#fff;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.5px;margin-left:4px">🧪 TEST / BETA</span>';
    }
    document.getElementById('feeBanner').innerHTML = '💰 <b>Kirish: '+M.fee+' Kitobcha</b> (birinchi javobda).' + (FLAVOR==='teams' ? ' 👥 Jamoangiz g\'olib chiqsa — HAR BIR a\'zo Kitobcha oladi (jamoa kattaroq bo\'lsa, ko\'proq!), eng ko\'p to\'g\'ri javob berganlar esa qo\'shimcha bonus oladi!' : '');
    if (FLAVOR === 'teams') { document.getElementById('myPtsLbl').textContent = 'Sizning ballaringiz'; }

    var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
    if(tg){try{tg.ready();tg.expand();}catch(e){}}
    function readInit(){if(tg&&tg.initData)return tg.initData;try{var q=new URLSearchParams(location.search).get('tgWebAppData');if(q)return q;}catch(e){}var h=(location.hash||'').replace(/^#/,'');if(h){try{var d=new URLSearchParams(h).get('tgWebAppData');if(d)return d;}catch(e){}}return'';}
    var INIT=readInit();
    var $=function(id){return document.getElementById(id);};
    var localSeconds=0,busy=false,lastQ=-1;
    var curOpts=[],curAnswered=false,curCorrectIdx=-1,curChoice=-1;
    function fmt(s){s=Math.max(0,s|0);var m=Math.floor(s/60),r=s%60;return(m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
    function esc(t){return(t||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function api(path,opts){opts=opts||{};opts.headers=Object.assign({'X-Telegram-Init-Data':INIT},opts.headers||{});return fetch(path,opts).then(function(r){return r.json();});}

    function renderOpts(){
      var box=$('opts');box.innerHTML='';
      curOpts.forEach(function(o,i){
        var b=document.createElement('button');b.className='opt';b.textContent=(i+1)+'. '+o;
        if(curAnswered){
          b.disabled=true;
          if(i===curCorrectIdx)b.className='opt correct';
          else if(i===curChoice)b.className='opt wrong';
        }else{ b.addEventListener('click',function(){answer(i);}); }
        box.appendChild(b);
      });
    }

    function statsHistoryHtml(s){
      var lt=s.lifetime||{};
      var h='<div class="statsgrid"><div class="sbox"><b>'+(lt.games||0)+'</b><span>O\'yin</span></div><div class="sbox"><b>'+(lt.points||0)+'</b><span>Jami ochko</span></div><div class="sbox"><b>'+(lt.best||0)+'</b><span>Rekord</span></div></div>';
      if(s.history&&s.history.length){
        h+='<div class="sect" style="margin-top:16px;text-align:left">🕘 O\'tgan o\'yinlar</div>';
        s.history.forEach(function(g){h+='<div class="hrow"><div class="hd">'+esc(g.date)+'</div><div class="hw">🥇 '+esc(g.winner)+' <span class="muted">('+g.winner_points+' ochko)</span></div><div class="muted" style="font-size:12px">'+g.players+' 👤</div></div>';});
      }
      return h;
    }

    function render(s){
      var live=$('live'),info=$('info');
      if(s.vip_locked){
        live.classList.add('hidden');info.classList.remove('hidden');
        $('timerLbl').textContent='VIP';$('subtitle').textContent='⭐️ Faqat Premium';
        info.innerHTML='<div class="em">👑</div><h2 style="color:#ffd700">VIP Premium Arena</h2><p style="color:#ffcc00;font-weight:600;font-size:15px">Ushbu arena faqat VIP Premium a\'zolari uchun!</p><p style="margin-top:10px;font-size:14px;color:var(--text-muted)">Ishtirok etish hamda <b>500 – 1000 Kitobcha</b> va <b>BEPUL Premium</b> yutib olish uchun Premium obunani faollashtiring.</p><div style="margin-top:18px"><a href="/dokon/" style="display:inline-block;background:linear-gradient(135deg,#ffd700,#ff9900);color:#111;font-weight:800;padding:12px 24px;border-radius:14px;text-decoration:none;box-shadow:0 4px 15px rgba(255,215,0,0.3)">⭐️ Premium Faollashtirish</a></div>'+statsHistoryHtml(s);
        localSeconds=0;$('timer').textContent='--:--';return;
      }
      if(s.status==='live'){
        live.classList.remove('hidden');info.classList.add('hidden');
        $('subtitle').textContent='Savol '+s.q_number+' / '+s.q_total;
        $('qn').textContent='SAVOL '+s.q_number+' / '+s.q_total;
        $('myPts').textContent=s.your_points||0;$('qnum').textContent=s.q_number+'/'+s.q_total;
        if(s.q_index!==lastQ){lastQ=s.q_index;curAnswered=false;curCorrectIdx=-1;curChoice=-1;$('toast').textContent='';}
        $('qtext').innerHTML = (s.q||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/&lt;b&gt;/gi,'<b>').replace(/&lt;\/b&gt;/gi,'</b>').replace(/\n/g,'<br>');
        var audioBox=$('audioBox');
        if(FLAVOR==='audioquote'||s.audio_url){
          audioBox.classList.remove('hidden');
          $('playAudioBtn').onclick=function(){
            if(s.audio_url){
              try{var aud=new Audio(s.audio_url);aud.play();}catch(e){}
            }else if(window.speechSynthesis){
              window.speechSynthesis.cancel();
              var clean=(s.q||'').replace(/\[.*?\]/g,'').trim();
              var u=new SpeechSynthesisUtterance(clean);
              u.rate=0.9;
              window.speechSynthesis.speak(u);
            }
          };
        }else{ audioBox.classList.add('hidden'); }
        var itemsRow=$('itemsRow');
        if(s.items&&s.items.length){
          itemsRow.classList.remove('hidden');
          itemsRow.innerHTML=s.items.map(function(it){return '<span class="chip">'+esc(it)+'</span>';}).join('');
        }else{ itemsRow.classList.add('hidden'); itemsRow.innerHTML=''; }
        var qimg=$('qimg');
        if(s.image){ qimg.src=s.image; qimg.classList.remove('hidden'); }
        else{ qimg.classList.add('hidden'); qimg.src=''; }
        curOpts=s.options||[];
        if(s.answered){curAnswered=true;curChoice=(s.your_choice!==undefined?s.your_choice:-1);}
        if(s.phase==='reveal'){curCorrectIdx=(s.correct_index!==undefined?s.correct_index:-1);curAnswered=true;$('timerLbl').textContent='NATIJA';}
        else{$('timerLbl').textContent='JAVOB';}
        renderOpts();
        var teamBar=$('teamBar');
        if(FLAVOR==='teams'){
          teamBar.classList.remove('hidden');
          var ap=s.team_a_points||0, bp=s.team_b_points||0, tot=ap+bp||1;
          $('teamABar').style.flex=(ap/tot); $('teamABar').textContent='A: '+ap;
          $('teamBBar').style.flex=(bp/tot); $('teamBBar').textContent='B: '+bp;
        } else { teamBar.classList.add('hidden'); }
        var b='';(s.leaderboard||[]).forEach(function(r,i){
          var cls=i===0?'g1':i===1?'g2':i===2?'g3':'';
          var teamCls = r.team==='a' ? ' team-a' : (r.team==='b' ? ' team-b' : '');
          var teamTag = r.team ? (r.team==='a'?' 🔵':' 🔴') : '';
          b+='<div class="lb"><div class="rank '+cls+'">'+(i+1)+'</div><div class="lb-name'+teamCls+'">'+esc(r.name)+teamTag+'</div><div class="pts">'+r.points+'</div></div>';
        });
        $('board').innerHTML=b||'<div class="muted" style="padding:6px 0">Hali ball yo\'q.</div>';
        localSeconds=s.seconds;
      }else{
        live.classList.add('hidden');info.classList.remove('hidden');
        if(s.status==='scheduled'){
          $('timerLbl').textContent='BOSHLANISH';$('subtitle').textContent='Tez orada';
          info.innerHTML='<div class="em">'+M.emoji+'</div><h2>O\'yin boshlanmoqda</h2><p>'+M.scheduled+' Tayyor turing!</p>'+statsHistoryHtml(s);
          localSeconds=s.seconds;
        }else if(s.status==='finished'){
          $('timerLbl').textContent='TUGADI';$('timer').textContent='00:00';$('subtitle').textContent='Tugadi';
          var w='';(s.leaderboard||[]).forEach(function(r,i){var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';var rew=r.reward?'<span style="color:var(--accent2);font-weight:800">🪙 +'+r.reward+'</span>':'';w+='<div class="lb"><div class="rank">'+medal+'</div><div class="lb-name">'+esc(r.name)+' <span class="muted">'+r.points+'</span></div><div class="pts">'+rew+'</div></div>';});
          var mine=s.your_reward?('<div class="stat" style="margin-top:12px"><div class="box"><b>🪙 +'+s.your_reward+'</b><span>Sizning mukofotingiz</span></div></div>'):'';
          info.innerHTML='<div class="em">🏁</div><h2>O\'yin tugadi!</h2><p>Ochko olganlar mukofot oldi 🎉</p>'+mine+(w?'<div style="text-align:left;margin-top:14px">'+w+'</div>':'')+statsHistoryHtml(s);
          localSeconds=0;
        }else{
          $('timerLbl').textContent='—';$('timer').textContent='--:--';$('subtitle').textContent='Kutilmoqda';
          info.innerHTML='<div class="em">'+M.emoji+'</div><h2>Hozircha o\'yin yo\'q</h2><p>'+M.none+'</p>'+statsHistoryHtml(s);
          localSeconds=0;
        }
      }
      var lt=s.lifetime||{games:0,points:0};var lel=$('lifetime');lel.classList.remove('hidden');
      lel.innerHTML="📊 Umumiy: <b>"+lt.games+"</b> o'yin · <b>"+lt.points+"</b> ochko";
      $('timer').textContent=fmt(localSeconds);
    }

    function poll(){api(M.api+'state/').then(function(s){if(!s||s.ok===false){$('info').classList.remove('hidden');$('live').classList.add('hidden');$('info').innerHTML='<div class="em">🔒</div><h2>Kirish xatosi</h2><p>Saytni ✨ Sayt tugmasi orqali qayta oching.</p>';return;}render(s);}).catch(function(){});}
    function answer(choice){
      if(busy||curAnswered)return;busy=true;
      api(M.api+'submit/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choice:choice})}).then(function(r){
        if(r.ok||r.error==='already_answered'){
          $('toast').textContent='';
          curAnswered=true;curChoice=choice;curCorrectIdx=(r.correct_index!==undefined?r.correct_index:-1);renderOpts();
          if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred(r.correct?'success':'error')}catch(e){}}
          poll();
        } else {
          var t=$('toast');t.className='toast bad';
          t.textContent=({premium_required:"👑 Ushbu arena faqat VIP Premium a'zolar uchun!",insufficient_balance:"🪙 Kirish uchun "+M.fee+" Kitobcha kerak — balansingiz yetarli emas.",not_answering:"Hozir javob vaqti emas."})[r.error]||"Qabul qilinmadi.";
        }
      }).catch(function(){}).then(function(){busy=false;});
    }
    setInterval(function(){if(localSeconds>0){localSeconds--;$('timer').textContent=fmt(localSeconds);}},1000);
    poll();setInterval(poll,1500);
  </script>
{% include "_tracking.html" with section="quiz-"|add:flavor %}
</body>
</html>
